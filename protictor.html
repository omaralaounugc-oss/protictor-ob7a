<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proctor</title>
<style>
  :root { --bg:#eceff3; --card:#fff; --ink:#1d2433; --mute:#6b7488; --line:#d6dbe5; --brand:#2f3a8f; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --card:#1d212c; --ink:#e8ebf2; --mute:#8f98ab; --line:#2f3545; --brand:#8d9bff; --warn:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  [hidden] { display:none !important; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:6px; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  @media (prefers-color-scheme: dark) { button.primary { color:#14171f; } }
  button.danger { color:var(--warn); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, li:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  input, textarea { width:100%; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:9px 11px; }
  #login { max-width:360px; margin:14vh auto 0; padding:28px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  #login h1 { margin:0 0 4px; font-size:22px; }
  #login p { margin:0 0 18px; color:var(--mute); }
  #login label { display:block; margin:12px 0 4px; font-weight:600; }
  #login button { width:100%; margin-top:18px; }
  .err { color:var(--warn); min-height:1.4em; margin-top:10px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header b { font-size:17px; }
  header span { color:var(--mute); margin-right:12px; }
  main { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px 20px; max-width:1100px; margin:0 auto; }
  @media (max-width:720px) { main { grid-template-columns:1fr; } }
  aside, section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  aside .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:9px 10px; border-radius:6px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li:hover { background:var(--bg); }
  li.on { background:var(--brand); color:#fff; }
  @media (prefers-color-scheme: dark) { li.on { color:#14171f; } }
  .empty { color:var(--mute); padding:10px 4px; }
  textarea { min-height:340px; margin-top:10px; font:13px/1.5 ui-monospace,Consolas,monospace; resize:vertical; white-space:pre; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .row .grow { flex:1; }
  #msg { color:var(--mute); margin-left:auto; align-self:center; }
</style>
</head>
<body>

<form id="login" hidden>
  <h1>Proctor</h1>
  <p>Sign in to open your scripts.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button class="primary" type="submit">Sign in</button>
  <div class="err" id="loginErr" role="alert"></div>
</form>

<div id="app" hidden>
  <header>
    <b>Proctor</b>
    <div><span id="who"></span><button id="out">Sign out</button></div>
  </header>
  <main>
    <aside>
      <div class="top"><b>Your scripts</b><button class="primary" id="add">Add script</button></div>
      <ul id="list"></ul>
      <div class="empty" id="none" hidden>No scripts yet. Select Add script to create your first one.</div>
    </aside>
    <section id="editor" hidden>
      <input id="name" placeholder="Script name" maxlength="80" aria-label="Script name">
      <textarea id="code" spellcheck="false" placeholder="Paste or write your script here" aria-label="Script content"></textarea>
      <div class="row">
        <button class="primary" id="save">Save changes</button>
        <button id="copy">Copy script</button>
        <button class="danger" id="del">Delete script</button>
        <span id="msg" role="status"></span>
      </div>
    </section>
    <section id="hint"><span class="empty">Select a script on the left, or add a new one.</span></section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, addDoc, setDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyD3VXTx9DysRGlp0lQsvGuT5RA0ZJhQ6lY",
  authDomain: "ob7a-4e30e.firebaseapp.com",
  projectId: "ob7a-4e30e",
  storageBucket: "ob7a-4e30e.firebasestorage.app",
  messagingSenderId: "719101039581",
  appId: "1:719101039581:web:00ddbdba15f41098179c34"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);

let uid = null, items = [], current = null; // current = {id|null, name, code}

const col = () => collection(db, "users", uid, "scripts");
const flash = t => { $("msg").textContent = t; setTimeout(() => $("msg").textContent = "", 2500); };

onAuthStateChanged(auth, async user => {
  uid = user ? user.uid : null;
  $("login").hidden = !!user;
  $("app").hidden = !user;
  if (user) { $("who").textContent = user.email; await load(); }
});

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch { $("loginErr").textContent = "Email or password is wrong. Check both and try again."; }
});
$("out").onclick = () => { current = null; signOut(auth); };

async function load() {
  const snap = await getDocs(query(col(), orderBy("updated", "desc")));
  items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}

function render() {
  const ul = $("list"); ul.replaceChildren();
  $("none").hidden = items.length > 0;
  for (const s of items) {
    const li = document.createElement("li");
    li.textContent = s.name || "Untitled";
    li.tabIndex = 0;
    if (current && current.id === s.id) li.className = "on";
    li.onclick = () => open(s);
    li.onkeydown = e => { if (e.key === "Enter") open(s); };
    ul.append(li);
  }
  $("editor").hidden = !current;
  $("hint").hidden = !!current;
}

function open(s) {
  current = { id: s.id, name: s.name, code: s.code };
  $("name").value = s.name || ""; $("code").value = s.code || "";
  render();
}

$("add").onclick = () => {
  current = { id: null, name: "", code: "" };
  $("name").value = ""; $("code").value = "";
  render(); $("name").focus();
};

$("save").onclick = async () => {
  if (!current) return;
  const data = { name: $("name").value.trim() || "Untitled", code: $("code").value, updated: serverTimestamp() };
  try {
    if (current.id) await setDoc(doc(db, "users", uid, "scripts", current.id), data);
    else current.id = (await addDoc(col(), data)).id;
    await load(); flash("Saved");
  } catch { flash("Could not save. Check your connection and try again."); }
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("code").value); flash("Copied"); }
  catch { $("code").select(); flash("Press Ctrl+C to copy"); }
};

$("del").onclick = async () => {
  if (!current) return;
  if (current.id) {
    if (!confirm("Delete this script? This can't be undone.")) return;
    try { await deleteDoc(doc(db, "users", uid, "scripts", current.id)); } catch { flash("Could not delete."); return; }
  }
  current = null; await load();
};
</script>
</body>
</html>
